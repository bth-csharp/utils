# .github/workflows/tests_kmom03.yml
name: Test Run for kmom03

on:
  workflow_call:
    inputs:
      course_id:
        required: true
        type: string
      available_assignments:
        required: true
        type: string
      student_id:
        required: true
        type: string

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies for Dice100
        working-directory: ./kmom03/Dice100
        run: dotnet restore

      - name: Build Dice100
        working-directory: ./kmom03/Dice100
        run: dotnet build --configuration Release

      - name: Run tests for Dice100
        working-directory: bth-csharp/utils/tests/kmom03/Dice100.Tests
        run: dotnet test
