on:
  workflow_call:
    inputs:
      course_id:
        required: true
        type: string
      available_assignments:
        required: true
        type: string
      student_id:
        required: true
        type: string

jobs:
  report-closed-pr-to-canvas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x


      - name: Visa contexts
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
          INPUTS_CONTEXT: ${{ toJSON(inputs) }}
          VARS_CONTEXT:   ${{ toJSON(vars) }}
          ENV_CONTEXT:    ${{ toJSON(env) }}
        run: |
          echo "$GITHUB_CONTEXT" | head -n 50
          echo "$INPUTS_CONTEXT"
          echo "$VARS_CONTEXT"
          echo "$ENV_CONTEXT"
          echo "${{ steps.resolve.outputs.assignment }}"


      - name: Update Canvas with closed PR
        uses: bth-csharp/utils/.github/actions/update-canvas@main
        with:
          subcommand: "grade_submission"
          grade: 'G'
          comment: 'Test gitconfig ✅'
          canvas_api_token: ${{ secrets.CANVAS_API_TOKEN }}
          course_id: ${{inputs.course_id}}
          assignment_id: 59781
          student_id: ${{ inputs.student_id }}
          read_org_token: "${{ secrets.READ_ORG_TOKEN }}"
