name: Kontrollera Menu-kataloger

on:
  workflow_dispatch:  # du kör den manuellt

jobs:
  check-repos:
    runs-on: ubuntu-24.04

    steps:
      - name: Hämta lista på alla repos i organisationen
        id: list
        env:
          GH_TOKEN: ${{ secrets.READ_ORG_TOKEN }}
        run: |
          echo "Hämtar repos..."
          gh api orgs/bth-csharp/repos --paginate --jq '.[] | .name' > repos.txt

      - name: Kontrollera varje repo
        env:
          GH_TOKEN: ${{ secrets.READ_ORG_TOKEN }}
        run: |
          echo "Repo;Menu finns;Menu.Tests finns" > resultat.csv
          while read -r repo; do
            echo "Kontrollerar $repo..."

            #
            # 1. Kolla om katalogen FINNS
            #
            menu_exists=$(gh api repos/bth-csharp/$repo/contents/kmom01/Menu \
                --jq '.[0].name' 2>/dev/null || echo "saknas")

            if [ "$menu_exists" = "saknas" ]; then
              hasMenu="❌"
              hasContent="❌"
            else
              hasMenu="✅"

              #
              # 2. Kolla om den INTE är tom (dvs API returnerar entries)
              #
              file_count=$(gh api repos/bth-csharp/$repo/contents/kmom01/Menu \
                  --jq 'length' 2>/dev/null || echo 0)

              if [ "$file_count" -gt 0 ]; then
                hasContent="✅"
              else
                hasContent="❌"
              fi
            fi

            echo "$repo;$hasMenu;$hasContent" >> resultat.csv

          done < repos.txt

          echo ""
          echo "Resultat:"
          cat resultat.csv

      - name: Ladda upp resultat som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Menu-check-resultat
          path: resultat.csv
          
