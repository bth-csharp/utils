name: 3-veckorskontroll

on:
  workflow_dispatch:  # du kör den manuellt

jobs:
  check-repos:
    runs-on: ubuntu-24.04

    steps:
      - name: Hämta lista på alla repos i organisationen
        id: list
        env:
          GH_TOKEN: ${{ secrets.READ_ORG_TOKEN }}
        run: |
          echo "Hämtar repos..."
          gh api orgs/bth-csharp/repos --paginate --jq '.[] | .name' > repos.txt

      - name: Kontrollera varje repo
        env:
          GH_TOKEN: ${{ secrets.READ_ORG_TOKEN }}
        run: |
          echo "Repo;Menu finns;Menu har innehåll;Menu tagg finns;Dice100 finns;Dice100 har innehåll" > resultat.csv
          while read -r repo; do
            # Hoppa över utils och repos som slutar på ht25
            if [[ "$repo" == "bth-csharp.github.io" || "$repo" == "ht26" || "$repo" == "owner" || "$repo" == "code" || "$repo" == "utils" || "$repo" =~ ht25$ ]]; then
              continue
            fi
            echo "Kontrollerar $repo..."

            #
            # 1. Kolla om Menu katalogen FINNS
            #
            menu_exists=$(gh api repos/bth-csharp/$repo/contents/kmom01/Menu \
                --jq '.[0].name' 2>/dev/null || echo "saknas")
            hasMenu="❌"
            hasContent="❌"
            hasTag="❌"
            if gh api repos/bth-csharp/$repo/contents/kmom01/Menu >/dev/null 2>&1; then
              hasMenu="✅"

              #
              # 2. Kolla om den INTE är tom (dvs API returnerar entries)
              #
              file_count=$(gh api repos/bth-csharp/$repo/contents/kmom01/Menu \
                  --jq 'length' 2>/dev/null || echo 0)

              if [ "$file_count" -gt 0 ]; then
                hasContent="✅"
              fi

              #
              # 3. Kolla om studenten är klar och har taggat kmom01
              #
              if gh api repos/bth-csharp/$repo/tags \
                   --jq '.[].name' 2>/dev/null |
                   grep -Eq '^v01\.[0-9]$'
              then
                hasTag="✅"
              fi
            fi

            #
            # 1. Kolla om Dice100 katalogen FINNS
            #
            hasDice100="❌"
            hasContentDice100="❌"
            if gh api repos/bth-csharp/$repo/contents/kmom02/Dice100 >/dev/null 2>&1; then
              hasDice100="✅"

              #
              # 2. Kolla om den INTE är tom (dvs API returnerar entries)
              #
              file_count=$(gh api repos/bth-csharp/$repo/contents/kmom02/Dice100 \
                  --jq 'length' 2>/dev/null || echo 0)

              if [ "$file_count" -gt 0 ]; then
                hasContentDice100="✅"
              fi
            fi

            echo "$repo;$hasMenu;$hasContent;$hasTag;$hasDice100;$hasContentDice100" >> resultat.csv

          done < repos.txt

          echo ""
          echo "Resultat:"
          cat resultat.csv

      - name: Ladda upp resultat som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Menu-check-resultat
          path: resultat.csv
          
