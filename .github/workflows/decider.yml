name: Decider

on:
  workflow_call:
    inputs:
      student_repo:
        required: false
        type: string
      student_branch:
        required: false
        type: string
      student_main:
        required: false
        type: string
      pr_number:
        required: false
        type: string
      course_id:
        required: true
        type: string
      available_assignments:
        required: true
        type: string
      student_id:
        required: true
        type: string
      kmom_paths:
        required: true
        type: string
    outputs:
      all_tests_passed:
        description: "True if all selected test suites passed"
        value: ${{ jobs.decide.outputs.all_tests_passed }}

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # för att kommentera PR / sätta labels
      STUDENT_READ_TOKEN: ${{ secrets.READ_ORG_TOKEN }}       # för att läsa interna testrepo
    outputs:
      all_tests_passed: ${{ steps.set-result.outputs.all_tests_passed }}
    steps:
      - name: Ensure student_repo has updated workflow file
        run: |
          repo="${{ inputs.student_repo }}"
          branch=${{ inputs.student_branch }}
          if [ -z "$repo" ] || [ -z "$branch" ]; then
            echo "::error::New workload file is needed! Download and try again!"
            exit 1
          fi
          echo "✅ Workflow file main.yml is updated!"

      - name: Debug folders
        run: |
          echo "Setup for testing student code"
          echo "repository: '${{ inputs.student_repo }}'"
          echo "student_branch: '${{ inputs.student_branch }}'"
          echo "student_main: '${{ inputs.student_main }}'"
          echo "student_sha: '${{ inputs.student_sha }}'"
          
      - name: Checkout student code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.student_repo }}
          ref: ${{ inputs.student_main }}
          token: ${{ env.STUDENT_READ_TOKEN }}
          path: student
      
      - name: Check student main.yml content
        run: |
          file="student/.github/workflows/main.yml"
          if [ ! -f "$file" ]; then
            echo "::error::main.yml is missing!"
            exit 1
          fi

          if ! grep -q "student_repo" "$file" || ! grep -q "student_branch" "$file"; then
            echo "::error::main.yml does not contain required inputs!"
            exit 1
          fi

      - name: Checkout internal test repo
        uses: actions/checkout@v4
        with:
          repository: bth-csharp/utils
          token: ${{ env.STUDENT_READ_TOKEN }}
          path: utils

      - name: Debug student repo files
        run: |
          pwd
          echo "--- Root content ---"
          ls ..
          echo "--- Start content ---"
          ls
          echo "RESULT_DIR=$(pwd)" >> $GITHUB_ENV
          echo "--- Student repo content ---"
          ls -R student || echo "Student folder missing"
          echo "--- Tests content ---"
          ls -R utils/tests

      - name: Run tests for bth/submit/kmom03
        if: ${{ inputs.student_branch == 'bth/submit/kmom03' }}
        id: tests_kmom03
        env:
          PROJECT_ROOT: ${{ github.workspace }}/student
        run: |
          echo "PROJECT_ROOT = $PROJECT_ROOT"
          ROOT_DIR=$(pwd)
          echo "Workspace root: $ROOT_DIR"
          echo "Adding ProjectReference to tests"
          STUDENT_KMOM01="../../../../student/kmom01/Menu/Menu.csproj"
          STUDENT_KMOM02="../../../../student/kmom02/Dice100/Dice100.csproj"
          STUDENT_KMOM03="../../../../student/kmom03/Dice100/Dice100.csproj"
          echo "Student project: $STUDENT_KMOM01"
          echo "Student project: $STUDENT_KMOM02"
          echo "Student project: $STUDENT_KMOM03"
          TEST_KMOM01="utils/tests/kmom01/Menu.Tests"
          TEST_KMOM02="utils/tests/kmom02/Dice100.Tests"
          TEST_KMOM03="utils/tests/kmom03/Dice100.Tests"
          echo "Test project: $TEST_KMOM01"
          echo "Test project: $TEST_KMOM02"
          echo "Test project: $TEST_KMOM03"
          ALL_OK=true
          echo "Test result" > "$RESULT_DIR/result.txt"
          cd $TEST_KMOM01
          dotnet add reference "$STUDENT_KMOM01"
          if dotnet test --configuration Debug --logger:"trx;LogFileName=kmom01.trx"
          then
            echo "kmom01 ok" >> "$RESULT_DIR/result.txt"
          else
            echo "FAIL:kmom01" >> "$RESULT_DIR/result.txt"
            ALL_OK=false
          fi      
          cd $ROOT_DIR
          cd $TEST_KMOM02
          dotnet add Dice100.Tests.csproj reference "$STUDENT_KMOM02"
          if dotnet test  --configuration Debug --logger:"trx;LogFileName=kmom02.trx"
          then
            echo "kmom02 ok" >> "$RESULT_DIR/result.txt"
          else
            echo "FAIL:kmom02" >> "$RESULT_DIR/result.txt"
            ALL_OK=false
          fi
          cd $ROOT_DIR
          cd $TEST_KMOM03
          dotnet add Dice100.Tests.csproj reference "$STUDENT_KMOM03"
          if dotnet test  --configuration Debug --logger:"trx;LogFileName=kmom03.trx"
          then
            echo "kmom03 ok" >> "$RESULT_DIR/result.txt"
          else
            echo "FAIL:kmom03" >> "$RESULT_DIR/result.txt"
            ALL_OK=false
          fi
          cd $ROOT_DIR
          echo "Debug resultfile"
          ls "$RESULT_DIR"
          cat "$RESULT_DIR/result.txt"
          # Sätt environment-variabel för senare steg
          echo "ALL_OK=$ALL_OK" >> $GITHUB_ENV

      - name: Run tests for bth/submit/kmom06
        if: ${{ inputs.student_branch == 'bth/submit/kmom06' }}
        id: tests_kmom06
        run: |
          echo "Under development" >> "$RESULT_DIR/result.txt"
          cat $RESULT_DIR/result.txt || echo "Under development" > result.txt

      - name: Evaluate results
        id: set-result
        run: |
          if [ "$ALL_OK" = "true" ]; then
            echo "all_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "all_tests_passed=false" >> $GITHUB_OUTPUT
            echo "Recommendation: download the tests for the failing kmom locally, fix the errors and test the kmom locally before handing in again!" >> "$RESULT_DIR/result.txt"
          fi

      - name: Create comment on PR
        run: |
          echo "📄 Debug: visar var vi står"
          pwd
          ls .
          echo "Innehåll i result.txt"
          cat "$RESULT_DIR/result.txt"
          if [ -f $RESULT_DIR/result.txt ]; then
            BODY_CONTENT=$(cat $RESULT_DIR/result.txt)
          else
            BODY_CONTENT="Hittade ingen result.txt!"
          fi
          echo "Innehåll i BODY_CONTENT"
          echo "$BODY_CONTENT" 
          echo "BODY_CONTENT<<EOF" >> $GITHUB_ENV
          echo "$BODY_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Kommentera testresultat i PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.READ_ORG_TOKEN }}
          repository: ${{ inputs.student_repo }}
          issue-number: ${{ inputs.pr_number }}
          body: ${{ env.BODY_CONTENT }}

  add-label:
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: Remove Tests-failed if tests passed 
        if: ${{ needs.run-tests.outputs.all_tests_passed == 'true' }}
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.READ_ORG_TOKEN }}
          labels: Tests-failed
        continue-on-error: true
      - name: Add label Tests-failed
        if: ${{ needs.run-tests.outputs.all_tests_passed == 'false' }}
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.READ_ORG_TOKEN }}
          labels: Tests-failed
      - name: Add label Submitted
        if: ${{ needs.run-tests.outputs.all_tests_passed == 'true' }}
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.READ_ORG_TOKEN }}
          labels: |
            Submitted
            Tests-passed


  fail-if-needed:
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: Fail job if tests failed
        if: ${{ needs.run-tests.outputs.all_tests_passed == 'false' }}
        run: |
          echo "Tests failed. Download the tests locally and fix the errors!"
          exit 1

