name: Decider

on:
  workflow_call:
    inputs:
      student_repo:
        required: true
        type: string
      student_branch:
        required: true
        type: string
    outputs:
      all_tests_passed:
        description: "True if all selected test suites passed"
        value: ${{ jobs.decide.outputs.all_tests_passed }}

jobs:
  decide:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # för att kommentera PR / sätta labels
      STUDENT_READ_TOKEN: ${{ secrets.READ_ORG_TOKEN }}       # för att läsa interna testrepo
    outputs:
      all_tests_passed: ${{ steps.set-result.outputs.all_tests_passed }}
    steps:

      - name: Checkout student code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.student_repo }}
          ref: ${{ inputs.student_branch }}
          token: ${{ env.STUDENT_READ_TOKEN }}
          path: student-code

      - name: Checkout internal test repo
        uses: actions/checkout@v4
        with:
          repository: bth-csharp/utils
          token: ${{ env.STUDENT_READ_TOKEN }}
          path: tests

      - name: Determine task
        id: task
        run: |
          BRANCH="${{ inputs.student_branch }}"
          echo "Branch is: $BRANCH"
          if [[ "$BRANCH" == "bth/submit/kmom03" ]]; then
            echo {{ $BRANCH }} >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "bth/submit/kmom06" ]]; then
            echo {{ $BRANCH }} >> $GITHUB_OUTPUT
          else
            echo "Unknown student branch" >> $GITHUB_OUTPUT
          fi

      # ---------------- Run tests depending on task ----------------
      - name: Run tests for bth/submit/kmom03
        if: ${{ inputs.student_branch == 'bth/submit/kmom03' }}
        id: tests_kmom03
        working-directory: bth-csharp/utils/tests
        run: |
          ALL_OK=true
          dotnet test kmom01/Menu.Tests --logger:"trx;LogFileName=kmom01.trx" || { echo "FAIL:kmom01" > result.txt; ALL_OK=false; }
          dotnet test kmom02/Dice100.Tests --logger:"trx;LogFileName=kmom02.trx" || { echo "FAIL:kmom02" >> result.txt; ALL_OK=false; }
          dotnet test kmom03/Dice100.Tests --logger:"trx;LogFileName=kmom03.trx" || { echo "FAIL:kmom03" >> result.txt; ALL_OK=false; }
          cat result.txt || echo "All tests passed" > result.txt
          # Sätt environment-variabel för senare steg
          echo "ALL_OK=$ALL_OK" >> $GITHUB_ENV

      - name: Run tests for bth/submit/kmom06
        if: ${{ inputs.student_branch == 'bth/submit/kmom06' }}
        id: tests_kmom06
        run: |
          echo "Under development" >> result.txt
          cat result.txt || echo "Under development" > result.txt

      # ---------------- Decide pass/fail ----------------
      - name: Evaluate results
        id: set-result
        run: |
          if [ "$ALL_OK" = "true" ]; then
            echo "all_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "all_tests_passed=false" >> $GITHUB_OUTPUT
          fi


