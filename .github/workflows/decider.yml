name: Decider

on:
  workflow_call:
    inputs:
      student_repo:
        required: true
        type: string
      student_branch:
        required: true
        type: string
      student_main:
        required: true
        type: string
      student_sha:
        required: true
        type: string
    outputs:
      all_tests_passed:
        description: "True if all selected test suites passed"
        value: ${{ jobs.decide.outputs.all_tests_passed }}

jobs:
  decide:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # för att kommentera PR / sätta labels
      STUDENT_READ_TOKEN: ${{ secrets.READ_ORG_TOKEN }}       # för att läsa interna testrepo
    outputs:
      all_tests_passed: ${{ steps.set-result.outputs.all_tests_passed }}
    steps:
      - name: Debug folders
        run: |
          echo "Setup for testing student code"
          echo "repository: '${{ inputs.student_repo }}'"
          echo "student_branch: '${{ inputs.student_branch }}'"
          echo "student_main: '${{ inputs.student_main }}'"
          echo "student_sha: '${{ inputs.student_sha }}'"
          
      - name: Checkout student code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.student_repo }}
          ref: ${{ inputs.student_main }}
          token: ${{ env.STUDENT_READ_TOKEN }}
          path: student

      - name: Checkout internal test repo
        uses: actions/checkout@v4
        with:
          repository: bth-csharp/utils
          token: ${{ env.STUDENT_READ_TOKEN }}
          path: utils

      - name: Debug student repo files
        run: |
          pwd
          echo "--- Root content ---"
          ls ..
          echo "--- Start content ---"
          ls
          echo "--- Student repo content ---"
          ls -R student || echo "Student folder missing"
          echo "--- Tests content ---"
          ls -R utils/tests

      - name: Run tests for bth/submit/kmom03
        if: ${{ inputs.student_branch == 'bth/submit/kmom03' }}
        id: tests_kmom03
        run: |
          ALL_OK=true
          ROOT_DIR=$(pwd)
          echo "Workspace root: $ROOT_DIR"
          echo "Adding ProjectReference to tests"
          STUDENT_KMOM01="$ROOT_DIR/kmom01/Menu/Menu.csproj"
          STUDENT_KMOM02="$ROOT_DIR/kmom02/Dice100/Dice100.csproj
          STUDENT_KMOM03="$ROOT_DIR/kmom03/Dice100/Dice100.csproj
          echo "Student project: $STUDENT_KMOM01"
          echo "Student project: $STUDENT_KMOM02"
          echo "Student project: $STUDENT_KMOM03"
          TEST_KMOM01="$ROOT_DIR/utils/tests/kmom01/Menu.Tests/Menu.Tests.csproj"
          TEST_KMOM02="$ROOT_DIR/utils/tests/kmom02/Dice100.Tests/Dice100.Tests.csproj"
          TEST_KMOM03="$ROOT_DIR/utils/tests/kmom03/Dice100.Tests/Dice100.Tests.csproj"
          echo "Test project: $TEST_KMOM01"
          echo "Test project: $TEST_KMOM02"
          echo "Test project: $TEST_KMOM03"
          dotnet add "$TEST_KMOM01" reference "$STUDENT_KMOM01"
          dotnet add "$TEST_KMOM02" reference "$STUDENT_KMOM02"
          dotnet add "$TEST_KMOM03" reference "$STUDENT_KMOM03"
          dotnet test "$TEST_KMOM01" --configuration Debug --logger:"trx;LogFileName=kmom01.trx" || { echo "FAIL:kmom01" > result.txt; ALL_OK=false; }
          dotnet test "$TEST_KMOM02" --configuration Debug --logger:"trx;LogFileName=kmom02.trx" || { echo "FAIL:kmom02" >> result.txt; ALL_OK=false; }
          dotnet test "$TEST_KMOM03" --configuration Debug --logger:"trx;LogFileName=kmom03.trx" || { echo "FAIL:kmom03" >> result.txt; ALL_OK=false; }
          cat result.txt || echo "All tests passed" > result.txt
          # Sätt environment-variabel för senare steg
          echo "ALL_OK=$ALL_OK" >> $GITHUB_ENV

      - name: Run tests for bth/submit/kmom06
        if: ${{ inputs.student_branch == 'bth/submit/kmom06' }}
        id: tests_kmom06
        run: |
          echo "Under development" >> result.txt
          cat result.txt || echo "Under development" > result.txt

      - name: Evaluate results
        id: set-result
        run: |
          if [ "$ALL_OK" = "true" ]; then
            echo "all_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "all_tests_passed=false" >> $GITHUB_OUTPUT
          fi


