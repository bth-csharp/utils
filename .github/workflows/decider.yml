name: Decider Workflow

on:
  workflow_call:
    inputs:
      run_decider:
        description: 'Run decider job'
        required: false
        type: boolean
        default: false
      dotnet_version:
        required: false
        default: "9.0.x"
        type: string

jobs:

  decider:
    runs-on: ubuntu-latest
    if: github.event.inputs.run_decider == 'true'
    steps:
      - run: echo "Decider körs"

