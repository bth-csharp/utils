name: Decider

on:
  workflow_call:
    inputs:
      github_token:
        required: true
        type: string
    outputs:
      all_tests_passed:
        description: "True if all selected test suites passed"
        value: ${{ jobs.decide.outputs.all_tests_passed }}

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      all_tests_passed: ${{ steps.set-result.outputs.all_tests_passed }}
    steps:

      - name: Checkout student code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Determine task
        id: task
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Branch is: $BRANCH"
          if [[ "$BRANCH" == "bth/submit/kmom03" ]]; then
            echo "bth/submit/kmom03" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "bth/submit/kmom06" ]]; then
            echo "bth/submit/kmom06" >> $GITHUB_OUTPUT
          else
            echo "task=unknown" >> $GITHUB_OUTPUT
          fi

      # ---------------- Run tests depending on task ----------------
      - name: Run tests for bth/submit/kmom03
        if: steps.task.outputs.task == 'bth/submit/kmom03'
        id: tests_kmom03
        run: |
          dotnet test bth-csharp/utils/tests/kmom01/Menu.Tests --logger:"trx;LogFileName=test1.trx" || echo "FAIL:test1" > result.txt
          dotnet test bth-csharp/utils/tests/kmom02/Dice100.Tests --logger:"trx;LogFileName=test2.trx" || echo "FAIL:test2" >> result.txt
          dotnet test bth-csharp/utils/tests/kmom03/Dice100.Tests --logger:"trx;LogFileName=test3.trx" || echo "FAIL:test3" >> result.txt
          cat result.txt || echo "All tests passed" > result.txt

      - name: Run tests for bth/submit/kmom06
        if: steps.task.outputs.task == 'bth/submit/kmom06'
        id: tests_kmom06
        run: |
          echo "Under development" >> result.txt
          cat result.txt || echo "Under development" > result.txt

      # ---------------- Decide pass/fail ----------------
      - name: Evaluate results
        id: set-result
        run: |
          TASK=${{ steps.task.outputs.task }}
          if [ "$TASK" == "bth/submit/kmom03" ]; then
            if grep -q "FAIL" result.txt; then
              echo "all_tests_passed=false" >> $GITHUB_OUTPUT
            else
              echo "all_tests_passed=true" >> $GITHUB_OUTPUT
            fi
          elif [ "$TASK" == "2bth/submit/kmom06" ]; then
            if grep -q "FAIL" result.txt; then
              echo "all_tests_passed=false" >> $GITHUB_OUTPUT
            else
              echo "all_tests_passed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "all_tests_passed=false" >> $GITHUB_OUTPUT
          fi

      # ---------------- Post comment to PR ----------------
      - name: Post results as PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ inputs.github_token }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Test results for ${{ steps.task.outputs.task }}**
            ```
            $(cat result.txt)
            ```
